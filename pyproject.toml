[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnscan"
version = "0.1.0"
description = "Deterministic offline triage for CTF jeopardy binaries"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "pwnscan contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pwnscan = "pwnscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
