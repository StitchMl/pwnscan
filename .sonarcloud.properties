# SonarQube Cloud Automatic Analysis configuration.
# Production code and test code are disjoint; Ghidra scripts run inside
# Ghidra's Jython runtime and are not part of the pwnscan package.
sonar.sources=src/pwnscan
sonar.tests=tests
sonar.exclusions=ghidra_scripts/**,**/__main__.py
sonar.python.version=3.9,3.10,3.11,3.12,3.13
sonar.sourceEncoding=UTF-8
